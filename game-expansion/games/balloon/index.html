<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003457">
<title>Balloon | ZPLAY</title>
<link rel="stylesheet" href="./balloon.css">
<script type="module" src="./balloon.js"></script>
</head>
<body>
<main class="machine" aria-label="ZPLAY Balloon game">
  <header class="topbar">
    <a href="/" class="back" aria-label="Back to ZPLAY lobby">‹ <span>ZPLAY</span></a>
    <strong class="game-logo" aria-label="Balloon">BALLOON</strong>
    <div class="topbar-right">
      <div class="balance" aria-live="polite"><span class="coin">✦</span><span>Balance</span> <strong id="wallet">—</strong> <small>ETB</small></div>
      <button id="sound" type="button" aria-label="Mute game sound" aria-pressed="false">♪</button>
    </div>
  </header>
  <section class="sky" id="sky" aria-label="Animated balloon game scene">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="cloud-stage-label" id="roundLabel" aria-live="polite">Hold to fly</div>
    <div class="balloon-amount" id="balloonAmount" aria-live="off"><strong id="balloonMultiplier">1.00×</strong><span id="balloonValue">0.10 ETB</span></div>
    <button id="holdButton" class="hold-button" type="button" aria-label="Press and hold to fly, release to collect" aria-pressed="false" disabled><span id="handIcon">☝</span><span id="holdText">HOLD</span></button>
    <div class="sky-notice" id="notice" aria-live="polite">Sign in to your ZPLAY player account to play</div>
  </section>
  <footer class="controls">
    <div class="stake-area"><label for="stake">BET <span>ETB</span></label><div class="stake-row">
      <button type="button" class="step" id="minus" aria-label="Decrease stake">−</button>
      <select id="stake" aria-label="Stake in ETB"><option value="0.10">0.10</option><option value="0.50">0.50</option><option value="1.00">1.00</option><option value="2.00">2.00</option><option value="5.00">5.00</option><option value="10.00">10.00</option><option value="20.00">20.00</option><option value="50.00">50.00</option><option value="100.00">100.00</option></select>
      <button type="button" class="step" id="plus" aria-label="Increase stake">+</button>
    </div></div>
    <div class="result-area"><span class="round-label">LATEST RESULT</span><strong id="result">—</strong><span class="round-status" id="roundStatus">Connecting</span></div>
    <div class="secondary-actions"><button type="button" id="refresh" class="refresh">↻ Refresh</button><a href="/" class="lobby">All games</a></div>
  </footer>
</main>
</body>
</html>
