name: Burn Wilds payout audit (isolated, no wallet writes)

on:
  push:
    branches: [work/new90-burn-outcome-20261123]
    paths:
      - 'codex-work/new-games90-20261123/burn-wilds/**'
      - '.github/workflows/new90-burn-outcome-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audited-payout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Burn Wilds deterministic payout, receipt and existing component tests
        run: |
          node --test codex-work/new-games90-20261123/burn-wilds/expansion.test.mjs codex-work/new-games90-20261123/burn-wilds/outcome-audit.test.mjs codex-work/new-games90-20261123/burn-wilds/host-transport.test.mjs codex-work/new-games90-20261123/burn-wilds/player-entry.test.mjs codex-work/new-games90-20261123/burn-wilds/server/lifecycle.test.mjs codex-work/new-games90-20261123/burn-wilds/server/http.test.mjs codex-work/new-games90-20261123/burn-wilds/server/host-integration.test.mjs codex-work/new-games90-20261123/burn-wilds/runtime.test.mjs codex-work/new-games90-20261123/burn-wilds/audio.test.mjs
