# Feature-branch verification only. No deployment secrets, provider credentials,
# production accounts or live wallet endpoints are used.
# M20 and M100 reference images are preserved privately and are unavailable in
# this checkout. This workflow checks the retained M20 bounded arithmetic;
# continuation M20/M100 presentation components have a separate source-only job.
# These checks do not verify the private images or open the release gate.
name: Additive games and live presentation QA

on:
  push:
    branches:
      - work/new-games72-additive-20261121
      - work/new72-canonical-route-20261122
      - work/continue71-20261122
    paths:
      - 'codex-work/new-games72-20261121/**'
      - 'codex-work/new-games71-20261122/**'
      - 'codex-work/live-presentation-fixes-20261122/**'
      - 'codex-work/live-expansion-transport-fix-20261121/**'
      - 'codex-work/live-balloon-state-fix-20261121/**'
      - 'codex-work/user-request-20261122/**'
      - 'codex-work/new-requested71-20261122/**'
      - 'codex-work/continue71-20261122/**'
      - 'AGENTS.md'
      - '.github/workflows/new-games72-additive-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new72-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify the exact published reference evidence
        run: |
          python3 codex-work/new-games72-20261121/evidence-bundle/materialize.py --root .
          python3 codex-work/new-games72-20261121/evidence-bundle/materialize.py --index codex-work/new-games72-20261121/evidence-bundle/multi-hot-10/index.json --root .
          python3 -m unittest discover -s codex-work/new-games72-20261121/evidence-bundle -p test_materialize.py -v
      - name: Test capture, recovery, asset integrity, release gating and individual game arithmetic
        run: |
          node --test \
            codex-work/new-games72-20261121/capture/*.test.mjs \
            codex-work/new-games72-20261121/shared/*.test.mjs \
            codex-work/new-games72-20261121/release/*.test.mjs \
            codex-work/new-games72-20261121/integration/*.test.mjs \
            codex-work/new-games72-20261121/games/roll-x/tests/*.test.mjs \
            codex-work/new-games72-20261121/games/multi-hot-5-deluxe/tests/*.test.mjs \
            codex-work/new-games72-20261121/games/multi-hot-20/*.test.mjs
      - name: Test current Multi Hot 10 runtime, controls and isolated recovery regressions
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path('codex-work/new-games72-20261121/games/multi-hot-10')
          tests = sorted(root.rglob('*.test.mjs'))
          assert tests, 'Current Multi Hot 10 tests must be present'
          subprocess.run(['node', '--test', *map(str, tests)], check=True, timeout=180)
          PY
      - name: Verify the current ordered NEW71 catalogue and isolated visual preview boundary
        run: |
          node codex-work/new-requested71-20261122/integration/build-assets.mjs --check
          node codex-work/new-requested71-20261122/preview/build-manifest.mjs --check
          node --test \
            codex-work/new-requested71-20261122/integration/*.test.mjs \
            codex-work/new-requested71-20261122/preview/*.test.mjs
      - name: Validate the retained 72-game checkpoint with activation closed
        run: |
          node codex-work/new-games72-20261121/release/check-current-registry.mjs --expect-closed
      - name: Verify the retained ordered 71-game snapshot and protected exclusions
        run: |
          node --test codex-work/new-games71-20261122/active-scope.test.mjs
          node codex-work/new-games71-20261122/check-active-scope.mjs
      - name: Verify the deployed Deluxe geometry and immutable release wrapper
        run: |
          node --test \
            codex-work/live-presentation-fixes-20261122/deluxe-symbol-scale.test.mjs \
            codex-work/live-presentation-fixes-20261122/deployment/route.test.mjs \
            codex-work/live-presentation-fixes-20261122/deployment/multipart.test.mjs
      - name: Verify signed transport and explicit redirect rejection with isolated fixtures
        run: node --test codex-work/live-expansion-transport-fix-20261121/transport.test.mjs
      - name: Verify Balloon state polling and immutable client routing with isolated fixtures
        run: |
          node --test \
            codex-work/live-balloon-state-fix-20261121/state-polling.test.mjs \
            codex-work/live-balloon-state-fix-20261121/deployment/route.test.mjs

  existing-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Build the existing Player, Agent and Admin
        run: |
          npm ci --ignore-scripts
          npm run build --workspaces
      - name: Build equivalent six-module deployment within the existing Worker size budget
        env:
          ZPLAY_COMPACT_MODULE_ROOT: ${{ runner.temp }}/new71-compact-deployment
        run: |
          node codex-work/new-requested71-20261122/integration/compact-deployment.mjs \
            --active-main balloonstatefix20261121/entry.mjs \
            --output "$ZPLAY_COMPACT_MODULE_ROOT"
          node --test codex-work/new-requested71-20261122/integration/qa/compact-runtime.test.mjs
      - name: Preserve exact compiled deployment modules and source inventory
        uses: actions/upload-artifact@v4
        with:
          name: new71-compact-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/new71-compact-deployment
          if-no-files-found: error
          retention-days: 30
      - name: Verify the existing backend on its disposable SQLite test database
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_platform.py

  new71-m10-preview-browser:
    needs: [focused-unit, existing-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load the exact-run compiled deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: new71-compact-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/new71-compact-deployment
      - name: Install isolated browser tools for the retained NEW71 and M10 preview
        run: |
          npm install --prefix "$RUNNER_TEMP/new71-preview-tools" --ignore-scripts --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/new71-preview-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify ordered catalogue and preview controls at mobile and desktop sizes
        env:
          ZPLAY_QA_NODE_MODULES: ${{ runner.temp }}/new71-preview-tools/node_modules
          ZPLAY_NEW71_QA_OUTPUT: ${{ runner.temp }}/new71-preview-results/catalogue
          ZPLAY_M10_PREVIEW_QA_OUTPUT: ${{ runner.temp }}/new71-preview-results/m10
          ZPLAY_COMPACT_MODULE_ROOT: ${{ runner.temp }}/new71-compact-deployment
        run: |
          python3 - <<'PY'
          import pathlib, os, subprocess
          root = pathlib.Path(os.environ['ZPLAY_NEW71_QA_OUTPUT']).parent
          root.mkdir(parents=True, exist_ok=True)
          results = []
          for script in [
              'codex-work/new-requested71-20261122/integration/qa/run-isolated-browser.mjs',
              'codex-work/new-requested71-20261122/preview/qa/browser.mjs',
          ]:
              try:
                  result = subprocess.run(['node', script], timeout=180)
                  results.append((script, result.returncode))
              except subprocess.TimeoutExpired:
                  results.append((script, 'TIMEOUT_AFTER_180_SECONDS'))
          (root / 'fixture-exit-status.txt').write_text('\n'.join(f'{script}: {status}' for script, status in results) + '\n')
          assert all(status == 0 for _, status in results), results
          PY
      - name: Preserve exact-source catalogue and visual preview browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new71-m10-preview-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/new71-preview-results
          if-no-files-found: error
          retention-days: 30

  roll-x-browser:
    needs: focused-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/new72-browser-tools" --ignore-scripts --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/new72-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise checked-out Roll X against isolated immutable receipts
        env:
          NODE_PATH: ${{ runner.temp }}/new72-browser-tools/node_modules
          ZPLAY_NEW72_QA_OUTPUT: ${{ runner.temp }}/new72-browser-results
        run: node codex-work/new-games72-20261121/games/roll-x/qa/run-isolated-browser.cjs
      - name: Preserve the exact-source browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new72-roll-x-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/new72-browser-results
          if-no-files-found: error
          retention-days: 30

  shared-recovery-browser:
    needs: focused-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/new72-recovery-tools" --ignore-scripts --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/new72-recovery-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify native cross-tab and lost-response recovery on synthetic accounts
        env:
          NODE_PATH: ${{ runner.temp }}/new72-recovery-tools/node_modules
          ZPLAY_RECOVERY_QA_OUTPUT: ${{ runner.temp }}/new72-recovery-results
        run: node codex-work/new-games72-20261121/shared/qa/run-recovery-browser.cjs
      - name: Confirm failure during a held request still closes and records evidence
        env:
          NODE_PATH: ${{ runner.temp }}/new72-recovery-tools/node_modules
          ZPLAY_RECOVERY_QA_OUTPUT: ${{ runner.temp }}/new72-recovery-results/controlled-failure
          ZPLAY_RECOVERY_QA_FAILURE_PROBE: after-exclusive-lock
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          result = subprocess.run(['node', 'codex-work/new-games72-20261121/shared/qa/run-recovery-browser.cjs'], timeout=45)
          report = json.loads((pathlib.Path(os.environ['ZPLAY_RECOVERY_QA_OUTPUT']) / 'recovery-browser-report.json').read_text())
          assert result.returncode == 1 and report['success'] is False
          assert report['failureProbeRequested'] is True
          assert report['failure']['message'] == 'INTENTIONAL_CLEANUP_PROBE'
          assert report['browserClosed'] is True and report['scenarios'][0]['heldEvaluationDrained'] is True
          assert report['scenarios'][0]['debitCount'] == 1 and report['scenarios'][0]['creditCount'] == 1
          assert report['pageErrors'] == [] and report['forbiddenRequests'] == []
          print('Controlled negative path retained failure evidence and drained/closed the browser.')
          PY
      - name: Preserve exact-source native recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new72-recovery-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/new72-recovery-results
          if-no-files-found: error
          retention-days: 30

  roll-x-bfcache:
    needs: focused-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install full Chromium for native history restoration
        run: |
          npm install --prefix "$RUNNER_TEMP/new72-bfcache-tools" --ignore-scripts --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/new72-bfcache-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify trusted native BFCache restoration and resumed controls
        env:
          NODE_PATH: ${{ runner.temp }}/new72-bfcache-tools/node_modules
          ZPLAY_NEW72_BFCACHE_OUTPUT: ${{ runner.temp }}/new72-bfcache-results
        run: node codex-work/new-games72-20261121/games/roll-x/qa/run-bfcache-browser.cjs
      - name: Preserve native lifecycle outcome and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new72-roll-x-bfcache-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/new72-bfcache-results
          if-no-files-found: error
          retention-days: 30
