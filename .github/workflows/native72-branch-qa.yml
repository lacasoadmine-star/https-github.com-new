# Isolated verification of Native72 presentation/launcher code.
# Does not deploy, authenticate customers, or call wallet endpoints.
name: Native72 dedicated games QA
on:
  push:
    branches:
      - work/native72-session-presentation-20261119
    paths:
      - 'codex-work/native72-20261119/**'
      - '.github/workflows/native72-branch-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native72-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated per-game routing and release authentication boundary
        run: |
          node --test \
            codex-work/native72-20261119/changes/dedicated-resume/tests/multi-game-routing.test.mjs \
            codex-work/native72-20261119/changes/dedicated-resume/tests/deployment.test.mjs \
            codex-work/native72-20261119/changes/dedicated-resume/tests/wild-multi-stars-presentation.test.mjs
      - name: Verify shared wallet/request ownership and lifecycle
        run: |
          node --test \
            codex-work/native72-20261119/changes/dedicated-resume/tests/foundation.test.mjs
      - name: Verify Safari Simba foreground resume policy
        run: |
          node --test \
            codex-work/native72-20261119/changes/safari-r3/resume-sync.test.mjs
          node --check codex-work/native72-20261119/changes/safari-r3/game.mjs
          node --check codex-work/native72-20261119/changes/safari-r3/resume-sync.mjs
          node --test codex-work/native72-20261119/changes/safari-r3/auto-start-policy.test.mjs
          node --check codex-work/native72-20261119/changes/safari-r3/auto-start-policy.mjs
      - name: Verify Multi Hot 100 engine and sound lifecycle
        run: |
          node --test codex-work/fresh74-20261113/*.test.mjs
          node --check codex-work/fresh74-20261113/multihot100-entry.mjs
      - name: Verify 71-game readiness inventory and no-fake-live evidence gate
        run: |
          node --test codex-work/native72-20261119/qa/verify-remaining71.test.mjs
          node --check codex-work/native72-20261119/qa/verify-remaining71.mjs
      - name: Test Multi Hot 40 existing-session gameplay controller
        run: |
          node --test codex-work/native72-20261119/changes/multihot40-r1/live-controller.test.mjs
          node --check codex-work/native72-20261119/changes/multihot40-r1/live-controller.mjs
          node --test codex-work/native72-20261119/changes/multihot40-r1/scene.test.mjs
          node --check codex-work/native72-20261119/changes/multihot40-r1/scene.mjs
          node --check codex-work/native72-20261119/changes/multihot40-r1/mount.mjs
          node --test codex-work/native72-20261119/changes/multihot40-r1/title-assets.test.mjs
          node --check codex-work/native72-20261119/changes/multihot40-r1/title-assets.mjs
      - name: Verify corrected Multi Hot 40 live renderer and reference timing
        run: |
          node --test codex-work/native72-20261119/changes/multihot40-live-r2/*.test.mjs
          node --check codex-work/native72-20261119/changes/multihot40-live-r2/multihot40-motion.mjs
          node --check codex-work/native72-20261119/changes/multihot40-live-r2/multihot40-presentation.mjs
          node --check codex-work/native72-20261119/changes/multihot40-live-r2/multihot40-app.mjs
      - name: Verify Multi Hot 10 dedicated Player login and audio lifecycle
        run: |
          node --test codex-work/native72-20261119/changes/multihot10-r2/qa.test.mjs
          node --check codex-work/native72-20261119/changes/multihot10-r2/app.mjs
          node --check codex-work/native72-20261119/changes/multihot10-r2/audio.mjs
          node --check codex-work/native72-20261119/changes/multihot10-r2/presentation.mjs
          node --check codex-work/native72-20261119/changes/multihot10-r2/portrait.mjs
          node --check codex-work/native72-20261119/changes/multihot10-r2/reels.mjs
      - name: Verify Safari Simba live Samsung control hitboxes
        run: |
          node --test codex-work/native72-20261119/changes/safari-live-r5/mobile-touch.test.mjs
          node --check codex-work/native72-20261119/changes/safari-live-r5/game.mjs
      - name: Verify archived SmartSoft server math and existing Player ETB ledger adapter
        run: |
          node --test codex-work/native72-20261119/changes/batch01/server/official-math.test.mjs
          node --check codex-work/native72-20261119/changes/batch01/server/official-math.mjs
          node --check codex-work/native72-20261119/changes/batch01/server/official-math.test.mjs
          node --test codex-work/native72-20261119/changes/batch01/server/sw-nine-pg-adapter.test.mjs
          node --check codex-work/native72-20261119/changes/batch01/server/sw-nine-pg-adapter.mjs
      - name: Verify first ten unique game release checkpoints
        run: |
          node --test codex-work/native72-20261119/changes/batch01/release-readiness.test.mjs
          node --check codex-work/native72-20261119/changes/batch01/release-readiness.test.mjs
      - name: Verify new Multi Hot 20 and Burn Wilds server-receipt controllers
        run: |
          node --test codex-work/native72-20261119/changes/batch01/new-games-session.test.mjs
          node --check codex-work/native72-20261119/changes/batch01/multihot20/controller.mjs
          node --check codex-work/native72-20261119/changes/batch01/multihot5burnwilds/controller.mjs
      - name: Verify missing-game independent Canvas reels and background audio
        run: |
          node --test codex-work/native72-20261119/changes/batch01/scene-lifecycle.test.mjs
          node --check codex-work/native72-20261119/changes/batch01/multihot20/scene.mjs
          node --check codex-work/native72-20261119/changes/batch01/multihot5burnwilds/scene.mjs
      - name: Verify Multi Hot 20 and Burn Wilds original Player UI and KV route integration
        run: |
          node --test codex-work/native72-20261119/changes/batch01/player-kv-route.test.mjs
          node --test codex-work/native72-20261119/changes/batch01/player-session-ledger.test.mjs
          for game in multihot20 multihot5burnwilds; do
            for file in app controller scene session assets; do
              node --check "codex-work/native72-20261119/changes/batch01/$game/$file.mjs"
            done
          done
          node --check codex-work/native72-20261119/changes/batch01/player-kv-route.mjs
      - name: Verify first ten game batch dedicated audio engines
        run: |
          node --test codex-work/native72-20261119/changes/batch01/audio-r3/audio-lifecycle.test.mjs
          node --test codex-work/native72-20261119/changes/batch01/audio-r3/mobile-controls.test.mjs
          for game in multihot100 multihot5wild multihot5deluxe multihot5superwilds multihotwildways; do
            node --check "codex-work/native72-20261119/changes/batch01/audio-r3/$game/game.mjs"
          done
      - name: Verify Safari Simba immutable r4 package
        run: |
          node --test codex-work/native72-20261119/changes/safari-r4/release.test.mjs
      - name: Check patch formatting
        run: git diff --check HEAD~1 HEAD

  native72-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL QA client
        working-directory: codex-work/native72-20261119/changes/batch01/server/postgres-qa
        run: npm ci --ignore-scripts
      - name: Verify real transactions in a disposable local PostgreSQL container
        working-directory: codex-work/native72-20261119/changes/batch01/server/postgres-qa
        run: npm test
