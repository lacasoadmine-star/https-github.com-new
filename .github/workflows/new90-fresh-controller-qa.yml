name: NEW90 fresh Burn Wilds isolated controller validation

on:
  push:
    branches: [work/new90-fresh-20261123]
    paths:
      - 'codex-work/new-games90-20261123/fresh-burn-wilds/**'
      - '.github/workflows/new90-fresh-controller-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-burn-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new controller and own-origin media, no customer wallet calls
        run: |
          node --check codex-work/new-games90-20261123/fresh-burn-wilds/contract.mjs
          node --check codex-work/new-games90-20261123/fresh-burn-wilds/live-controller.mjs
          node --test codex-work/new-games90-20261123/fresh-burn-wilds/*.test.mjs
