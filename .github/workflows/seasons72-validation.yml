name: ZPLAY Seasons 72 offline validation
on:
  push:
    branches:
      - zplay/seasons72-20261126-r1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  seasons-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all 72 registry entries and safe spin adapter
        run: node --test tests/zplay-seasons72.test.mjs
