<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a101b">
  <meta name="color-scheme" content="dark">
  <title>Superwin · Independent edition</title>
  <link rel="stylesheet" href="/independent74/style.css">
  <script type="module" src="/independent74/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to games</a>
  <header class="site-header">
    <a class="brand" href="/independent74/" aria-label="Superwin independent games home"><span class="brand-mark" aria-hidden="true">S<span>↗</span></span><span>SUPERWIN<small>INDEPENDENT EDITION</small></span></a>
    <nav class="header-actions" aria-label="Account and navigation">
      <div class="wallet" aria-label="Account balance"><span class="wallet-icon" aria-hidden="true">◈</span><span><small>ACCOUNT BALANCE</small><strong id="wallet-balance">—</strong></span></div>
      <a class="back-portal" href="/">Main lobby <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main" tabindex="-1"><div class="loading-state" role="status"><span class="spinner"></span>Loading independent games…</div></main>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="rules-dialog" class="rules-dialog" aria-labelledby="rules-title"><div class="dialog-heading"><div><span class="eyebrow">INDEPENDENT EDITION</span><h2 id="rules-title">Game rules</h2></div><button id="close-rules" class="icon-button" aria-label="Close rules">×</button></div><div id="rules-body"></div><button id="rules-done" class="secondary-button">Done</button></dialog>
  <noscript><p class="empty-state">Enable JavaScript to open these games. Your account balance is never changed by this page without a server-confirmed round.</p></noscript>
</body>
</html>
