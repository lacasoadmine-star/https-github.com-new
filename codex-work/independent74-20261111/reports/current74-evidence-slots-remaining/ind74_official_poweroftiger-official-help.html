<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
    <section class="container">
        <div class="help-slider help-border">
            <div class="currency-info">
                <p class="currency-style">
                    <captionKey data-caption="help.slots.multihotburnwilds.paylines.currencyInfoTxt"></captionKey>
                    <span class="currencyValue headerCurrency"></span>
                </p>
            </div>

            <div class="help-bet">
                <div class="help-bet-text">
                    <div class="betcurrency">
                        <div class="bet" id="addelement">111</div>
                        <div class="currency">GEL</div>
                    </div>
                </div>
                <a class="right carousel-control" role="button">
                    <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
                    <span class="sr-only"></span>
                </a>
                <a class="left carousel-control" role="button">
                    <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
                    <span class="sr-only"></span>
                </a>
            </div>
        </div>

        <div class="page first-page">

            <span class="description"><captionkey data-caption="help.slots.poweroftiger.symbols.description2"></captionkey></span>
            <span class="description"><captionkey data-caption="help.slots.poweroftiger.symbols.description3"></captionkey></span>

            <div class="chapter">
                <div class="info-game">
                    <div class="info-game0">
                        <div class="info-row">
                            <div class="symbol-7"></div>
                            <div class="info-number help-box-6">
                                <div class="info-number-left">
                                    <p>3 -</p>
                                </div>
                                <div class="info-number-right">
                                    <p>75</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="info-game">
                    <div class="info-game1">

                            <div class="symbol-6"></div>

                                </div>
                                <div class="info-number-right">
                                    <p>75</p>
                                </div>
                            </div>
                        </div>
                        <div class="info-row">
                            <div class="symbol-5"></div>

                                <div class="info-number-left">
                                    <p>3 -</p>
                                </div>
                                <div class="info-number-right">
                                    <p>35</p>
                                </div>
                            </div>
                        </div>
                        <div class="info-row">
                            <div class="symbol-4"></div>

                                <div class="info-number-left">
                                    <p>3 -</p>
                                </div>
                                <div class="info-number-right">
                                    <p>20</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="info-game">
                    <div class="info-game1">
                        <div class="info-row">
                            <div class="symbol-3"></div>
                            <div class="info-number help-box-3">
                                <div class="info-number-left">
                                    <p>3 -</p>
                                </div>
                                <div class="info-number-right">
                                    <p>75</p>
                                </div>
                            </div>
                        </div>

                            <div class="symbol-2"></div>
                            <div class="info-number help-box-4">
                                <div class="info-number-left">
                                    <p>3 -</p>
                                </div>
                                <div class="info-number-right">
                                    <p>35</p>
                                </div>
                            </div>
                        </div>
                        <div class="info-row">
                            <div class="symbol-1"></div>

                                <div class="info-number-right">
                                    <p>20</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

        <div class="page">
            <span class="header"><captionkey data-caption="help.slots.poweroftiger.page1.header"></captionkey></span>

            <span class="page-1-description"><captionkey data-caption="help.slots.poweroftiger.page1.description2"></captionkey></span>

            <div class="page-1-image"></div>

                        <div class="page-3-spin-top">

                            <span class="page-3-description-2"><captionkey data-caption="help.slots.poweroftiger.buttons.turbo.description"></captionkey></span>

                            <span class="page-3-header"><captionkey data-caption="help.slots.poweroftiger.buttons.holdandspin.header"></captionkey></span>

                            <div>
                                <span class="page-3-balance-description-amount">10,000.00</span>
                                <span class="currencyValue inbt" style="margin-left: 3px;">GEL</span>

                    <div class="page-3-image-4-description">
                        <span class="page-3-header"><captionkey data-caption="help.slots.poweroftiger.buttons.balance.header"></captionkey></span>

                                <span class="currencyValue inbt" style="margin-left: 3px;">GEL</span>

                        <span class="page-3-header"><captionkey data-caption="help.slots.poweroftiger.buttons.sound.header"></captionkey></span>
                        <span class="page-3-description-8"><captionkey data-caption="help.slots.poweroftiger.buttons.sound.description"></captionkey></span>

            <span class="header"><captionkey data-caption="help.slots.poweroftiger.otherrules.header"></captionkey></span>

            <div class="page-4-horizontal-div">
                <div>

                    <span class="page-4-description" style="margin-top: 20px"><captionkey data-caption="help.slots.poweroftiger.otherrules.description1"></captionkey></span>
                    <span class="page-4-description" style="margin-top: 10px; margin-bottom: 20px"><captionkey data-caption="help.slots.poweroftiger.otherrules.description2"></captionkey></span>

                        <span class="page-4-description-1"><captionkey data-caption="help.slots.poweroftiger.otherrules.gamertp.value"></captionkey></span>
