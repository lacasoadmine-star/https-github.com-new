<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}} · ZPLAY</title><link rel="stylesheet" href="/zplay-originals/style.css"><script type="module" src="/zplay-originals/app.mjs"></script></head>
<body class="original-game {{THEME}}" data-game="{{GAME}}">
<main>
<header><a href="/#zplay-original-games">Back to ZPLAY</a><h1>{{TITLE}}</h1><p>{{DESCRIPTION}}</p></header>
<div class="readouts"><span>Score<output id="score">0</output></span><span>Multiplier<output id="multiplier">1×</output></span><span>Round<output id="rounds">0</output></span></div>
<div class="board" id="board" aria-label="Three reels"></div>
<div class="actions"><button id="auto">AUTO</button><button id="spin" class="primary">SPIN</button><button id="level">Level 1</button></div>
<div class="options"><button id="rules">Rules</button><button id="sound" aria-pressed="false">Sound off</button><button id="turbo" aria-pressed="false">Turbo off</button></div>
<p id="status" role="status" aria-live="polite">Ready</p>
<footer>Free play. Score points have no cash value.</footer>
<dialog id="dialog"><form method="dialog"><h2 id="dialog-title"></h2><div id="dialog-content"></div><button value="cancel">Close</button></form></dialog>
</main></body></html>
